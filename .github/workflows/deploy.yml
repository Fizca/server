name: Deploy to Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for AWS OIDC
  contents: read

env:
  AWS_REGION: us-east-2
  FUNCTION_NAME: fennec-backend
  ECR_REPO: fennec-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:$GITHUB_SHA"
          # Tags are immutable. On a re-run for the same commit the image
          # already exists, so skip the build and reuse it.
          if aws ecr describe-images \
               --repository-name "$ECR_REPO" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists; skipping build."
          else
            # --provenance=false --sbom=false: buildx's docker-container driver
            # attaches attestations by default, producing an OCI image index that
            # Lambda rejects. Push a single image manifest instead.
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false -t "$IMAGE" --push .
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE" \
            --publish
